# plan:角度单位deg，时间s。不会自动使能机械臂。
speed_deg_s: 0.5
ramp_s: 3.0
settle_s: 1.0
stable_s: 0.5
velocity_tolerance: 0.15       # 实测速度和正反向速度匹配相对误差
sample_tolerance_deg: 0.15     # 角度采样窗/最大配对误差
hold_tolerance_deg: 0.2
min_samples: 3
feedback_timeout_s: 1.0
sweeps:
  - joint: 7                                 # 要扫描的关节编号
    pose_deg: [0, -30, 20, 45, 10, 30, 0]    # 本次扫描所有关节的初始角度
    range_deg: [-10, 10]                     # 扫描起始和结束角度
    points_deg: [-5, 0, 5]                   # 采样角度，至少3个，严格递增

  - joint: 6
    pose_deg: [0, -30, 20, 45, 10, 0, 0]
    range_deg: [-10, 10]
    points_deg: [-5, 0, 5]

  - joint: 5
    pose_deg: [0, -30, 20, 45, 0, 0, 0]
    range_deg: [-10, 10]
    points_deg: [-5, 0, 5]

  - joint: 4
    pose_deg: [0, -30, 20, 45, 0, 0, 0]
    range_deg: [35, 55]
    points_deg: [40, 45, 50]

  - joint: 3
    pose_deg: [0, -30, 20, 45, 0, 0, 0]
    range_deg: [10, 30]
    points_deg: [15, 20, 25]

  - joint: 2
    pose_deg: [0, -30, 20, 45, 0, 0, 0]
    range_deg: [-40, -20]
    points_deg: [-35, -30, -25]

  - joint: 1
    pose_deg: [0, -30, 20, 45, 0, 0, 0]
    range_deg: [-10, 10]
    points_deg: [-5, 0, 5]