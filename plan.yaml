# 仿真7→1轴短扫描；每轴一组姿态，扩展不同pose_deg可增加辨识覆盖。
speed_deg_s: 5.0
ramp_s: 1.0
settle_s: 0.2
stable_s: 0.2
velocity_tolerance: 10       # 实测速度和正反向速度匹配相对误差
sample_tolerance_deg: 10     # 角度采样窗/最大配对误差
sweeps:
  - joint: 7
    pose_deg: [0, 0, 0, 0, 0, 0, 0]
    range_deg: [-30, 30]
    points_deg: [-1, 0, 1]

  - joint: 6
    pose_deg: [0, 0, 0, 0, 0, 0, 0]
    range_deg: [-30, 30]
    points_deg: [-1, 0, 1]

  - joint: 5
    pose_deg: [0, 0, 0, 0, 0, 0, 0]
    range_deg: [-30, 30]
    points_deg: [-1, 0, 1]

  - joint: 4
    pose_deg: [0, 0, 0, 0, 0, 0, 0]
    range_deg: [-30, 30]
    points_deg: [-1, 0, 1]

  - joint: 3
    pose_deg: [0, 0, 0, 0, 0, 0, 0]
    range_deg: [-30, 30]
    points_deg: [-1, 0, 1]

  - joint: 2
    pose_deg: [0, 0, 0, 0, 0, 0, 0]
    range_deg: [-30, 30]
    points_deg: [-1, 0, 1]

  - joint: 1
    pose_deg: [0, 0, 0, 0, 0, 0, 0]
    range_deg: [-30, 30]
    points_deg: [-1, 0, 1]
