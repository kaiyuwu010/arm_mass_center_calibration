    pose_deg: [0, -15, 20, 45, 10, 30, 20]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节6，姿态B
  - joint: 6
    pose_deg: [45, 30, -35, -40, 45, -30, -30]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节6，姿态C
  - joint: 6
    pose_deg: [-45, -15, 40, 30, -35, 45, 45]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节5，姿态A
  - joint: 5
    pose_deg: [0, -15, 20, 45, 10, 30, 20]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节5，姿态B
  - joint: 5
    pose_deg: [45, 30, -35, -40, 45, -30, -30]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节5，姿态C
  - joint: 5
    pose_deg: [-45, -15, 40, 30, -35, 45, 45]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节4，姿态A
  - joint: 4
    pose_deg: [0, -15, 20, 45, 10, 30, 20]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节4，姿态B
  - joint: 4
    pose_deg: [45, 30, -35, -40, 45, -30, -30]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节4，姿态C
  - joint: 4
    pose_deg: [-45, -15, 40, 30, -35, 45, 45]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节3，姿态A
  - joint: 3
    pose_deg: [0, -15, 20, 45, 10, 30, 20]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节3，姿态B
