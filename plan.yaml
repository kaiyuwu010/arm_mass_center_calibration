  - joint: 4
    pose_deg: [0.0, -15.0, 20.0, 45.0, 10.0, 29.0, 20.0]
    range_deg: [1, 59]

  # 关节4，姿态B
  - joint: 4
    pose_deg: [45.0, 30.0, -35.0, 1.0, 45.0, -29.0, -30.0]
