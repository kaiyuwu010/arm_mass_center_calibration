  - joint: 7
    pose_deg: [0, -30, 20, 45, 10, 30, 20]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节7，姿态B
  - joint: 7
    pose_deg: [45, 30, -35, -40, 45, -30, -30]
    range_deg: [-30, 30]
    points_deg: [-20, -10, 0, 10, 20]

  # 关节7，姿态C
