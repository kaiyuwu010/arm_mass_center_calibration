# 仿真多姿态标定：7→1轴，每轴3组姿态；未验证真机碰撞。
speed_deg_s: 10.0
transfer_speed_deg_s: 30.0   # 基准位姿切换速度，不用于扫描
ramp_s: 1.0
settle_s: 0.2
stable_s: 0.2
velocity_tolerance: 0.15     # 速度相对容差15%
sample_tolerance_deg: 0.8    # 10deg/s时保持采样窗口通过时间，约8个样本/方向
hold_tolerance_deg: 0.2
min_samples: 3
feedback_timeout_s: 1.0
sweeps:
  # 关节7，姿态A
  - joint: 7
    pose_deg: [0.0, -15.0, 20.0, 45.0, 10.0, 29.0, 20.0]
    range_deg: [-79, 79]

  # 关节7，姿态B
  - joint: 7
    pose_deg: [45.0, 30.0, -35.0, 1.0, 45.0, -29.0, -30.0]
    range_deg: [-79, 79]

  # 关节7，姿态C
  - joint: 7
    pose_deg: [-45.0, -15.0, 40.0, 30.0, -35.0, 29.0, 45.0]
    range_deg: [-79, 79]

  # 关节6，姿态A
  - joint: 6
    pose_deg: [0.0, -15.0, 20.0, 45.0, 10.0, 29.0, 20.0]
    range_deg: [-29, 29]

  # 关节6，姿态B
  - joint: 6
    pose_deg: [45.0, 30.0, -35.0, 1.0, 45.0, -29.0, -30.0]
    range_deg: [-29, 29]

  # 关节6，姿态C
  - joint: 6
    pose_deg: [-45.0, -15.0, 40.0, 30.0, -35.0, 29.0, 45.0]
    range_deg: [-29, 29]

  # 关节5，姿态A
  - joint: 5
    pose_deg: [0.0, -15.0, 20.0, 45.0, 10.0, 29.0, 20.0]
    range_deg: [-89, 89]

