# 仿真多姿态标定：7→1轴，每轴3组姿态；未验证真机碰撞。
speed_deg_s: 5.0
ramp_s: 1.0
settle_s: 0.2
stable_s: 0.2
velocity_tolerance: 0.15     # 速度相对容差15%
sample_tolerance_deg: 0.4    # 采样角度窗口±0.4°及最大配对误差
hold_tolerance_deg: 0.2
min_samples: 3
feedback_timeout_s: 1.0
sweeps:
